name: tests
# Automated integrity tests: (1) the world generator is byte-deterministic per
# seed; (2) world-level statistics regenerate exactly from the released run
# summaries, matching the archived main table.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generator determinism (same seed -> byte-identical world)
        run: |
          python environments/generator.py --machines 5 --episodes 200 --seed 42 --out /tmp/g1
          python environments/generator.py --machines 5 --episodes 200 --seed 42 --out /tmp/g2
          diff /tmp/g1/world.json /tmp/g2/world.json
          diff /tmp/g1/episodes.jsonl /tmp/g2/episodes.jsonl

      - name: Canonical dataset fixity (released artifacts unchanged)
        run: cd data && sha256sum -c SHA256SUMS

      - name: Statistics regenerate from released summaries
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/final_stats.py --out /tmp/stats
          diff /tmp/stats/main_table.md docs/paper/final_stats/main_table.md

      - name: Per-arm consistency (results.jsonl vs summary.json)
        run: |
          python - << 'EOF'
          import json, pathlib, sys
          bad, checked = [], 0
          for s in pathlib.Path("runs").rglob("summary.json"):
              r = s.parent / "results.jsonl"
              if not r.exists():
                  continue
              rows = [json.loads(l) for l in r.open(encoding="utf-8")]
              summ = json.loads(s.read_text(encoding="utf-8"))
              if not rows or "exact_accuracy" not in summ or summ["exact_accuracy"] is None:
                  continue
              acc = sum(x.get("exact_correct", False) for x in rows) / len(rows)
              checked += 1
              if summ.get("episodes") != len(rows) or abs(acc - summ["exact_accuracy"]) > 1e-9:
                  bad.append(f"{s.parent}: rows={len(rows)} acc={acc:.4f} vs summary={summ.get('episodes')}/{summ['exact_accuracy']:.4f}")
          print(f"checked {checked} arms")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          EOF
